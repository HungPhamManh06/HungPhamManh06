# 🐍 Snake Animation - Hiệu ứng rắn ăn contribution graph
# File này PHẢI đặt tại: .github/workflows/snake.yml
# Sau khi push, vào Settings -> Actions -> General -> bật "Read and write permissions"
# và chạy workflow lần đầu ở tab Actions -> Generate Snake

name: Generate Snake Animation

on:
  schedule:
    # Chạy mỗi 6 tiếng để cập nhật rắn (0h, 6h, 12h, 18h)
    - cron: "0 */6 * * *"
  workflow_dispatch: # Cho phép bấm nút chạy thủ công
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
            dist/github-contribution-grid-snake.gif?color_snake=orange&color_dots=#bfd6f6,#8dbdff,#64a1f4,#4b91f1,#3c7dd9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push snake to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: "chore: update snake animation"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
